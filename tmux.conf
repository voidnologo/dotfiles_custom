set -sg escape-time 0
set -g prefix C-Space
# source-file "${HOME}/.tmux/themes/default.tmux"
source-file "${HOME}/.tmux/themes/gray.tmuxtheme"
set -g default-terminal "tmux-256color"
set -g focus-events on

# -----------------------------------------------------------------------------
# Turn on window renumbering
# -----------------------------------------------------------------------------
set-option -g renumber-windows on

# -----------------------------------------------------------------------------
# Resize tmux panes with the mouse
# -----------------------------------------------------------------------------
# set -g mouse on
# bind -T root MouseDrag1Border resize-pane -M

# -----------------------------------------------------------------------------
# Turn on Vim mode for movement
# Also allows easy upwards searching
# -----------------------------------------------------------------------------
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# Pane scrollback buffer size
# -----------------------------------------------------------------------------
set-option -g history-limit 300000

# -----------------------------------------------------------------------------
# Don't resize the screen when users are in different windows
# -----------------------------------------------------------------------------
setw -g aggressive-resize on

# -----------------------------------------------------------------------------
# Vim visual selection and yank when in copy mode
# -----------------------------------------------------------------------------
bind Space copy-mode
bind C-Space copy-mode
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -Tcopy-mode-vi 'Y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -Tcopy-mode-vi Escape send -X cancel

# Enable OSC 52 clipboard integration for better terminal compatibility
set -s set-clipboard on

# -----------------------------------------------------------------------------
# After we have something yanked back in Vim we can paste our yanked selection
# anywhere we are in insert mode with (prefix p). This works in the vim buffer,
# search and fuzzy finder buffer for example
# -----------------------------------------------------------------------------
bind p paste-buffer

# -----------------------------------------------------------------------------
# Easier for my brain to remember to split the pane with - and \
# which resemble a horizontal and vertical split respectively
# doesn't override default (prefix ") and (prefix &)
# -----------------------------------------------------------------------------
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# visual notification of activity in other windows
# -----------------------------------------------------------------------------
setw -g monitor-activity on
set -g visual-activity on

# -----------------------------------------------------------------------------
# Welcome to wonderland
#
# terminal-features applies to the OUTER terminal, whatever it calls itself.
# The old ",xterm:Tc" override never matched, because ghostty reports
# xterm-ghostty and that pattern has no wildcard.
#   RGB     - 24-bit colour
#   usstyle - coloured undercurl, which diagnostics are drawn with
# -----------------------------------------------------------------------------
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# -----------------------------------------------------------------------------
# Switch between tmux screen splits and Vim splits with the same keys!
# <C-h><C-j><C-k><C-l>
# -----------------------------------------------------------------------------
# The test reads the pane's foreground process rather than the command tmux
# was given, so it survives wrappers, and it is anchored: the old unanchored
# grep for "vim" matched any command whose name merely contained it. fzf is
# included so C-j and C-k move the selection in a picker instead of the pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# The same keys keep working once you are in copy mode.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# -----------------------------------------------------------------------------
# Per-pane labels + colored borders
#   <prefix> C  -> prompts for color, then title (e.g. red, prod)
#   <prefix> M-c -> clear label/color on the active pane
# -----------------------------------------------------------------------------
set -g pane-border-status top
set -g pane-border-format "#[fg=#{?@pane_color,#{@pane_color},default}] #{?pane_title,#{pane_title},#{pane_index}} "
set -g pane-border-style       "fg=#{?@pane_color,#{@pane_color},default}"
set -g pane-active-border-style "fg=#{?@pane_color,#{@pane_color},default},bold"

bind-key C command-prompt -p "color:,title:" \
  "set -p @pane_color '%1' ; select-pane -T '%2'"

bind-key M-c run-shell "tmux set -pu @pane_color ; tmux select-pane -T ''"

# -----------------------------------------------------------------------------
# Reload this file without restarting the server
# -----------------------------------------------------------------------------
bind r source-file "${HOME}/.tmux.conf" \; display-message "tmux.conf reloaded"

# -----------------------------------------------------------------------------
# Popups
#   <prefix> g -> a shell in the current pane's directory, over the top
#   <prefix> j -> jump to another session
#   <prefix> J -> jump to a window in any session
# -----------------------------------------------------------------------------
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

bind j display-popup -E -w 60% -h 50% "\
  tmux list-sessions -F '#{session_name}' \
  | grep -v \"^$(tmux display-message -p '#S')\\$\" \
  | fzf --reverse --prompt 'session> ' \
  | xargs -r tmux switch-client -t"

bind J display-popup -E -w 70% -h 50% "\
  tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' \
  | fzf --reverse --prompt 'window> ' \
  | cut -d' ' -f1 \
  | xargs -r tmux switch-client -t"
